name: Update top languages card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=IkerLopDev&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=00000000
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit card
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add profile/top-langs.svg
          git commit -m "Update top languages card" || exit 0
          git push
